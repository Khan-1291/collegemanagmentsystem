services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpgcm}
      POSTGRES_USER: ${POSTGRES_USER:-gpgcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gpgcm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gpgcm}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-[]}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-GPGCM College <onboarding@resend.dev>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      UPLOAD_DIR: /data/uploads
      PROFILE_UPLOAD_DIR: /data/uploads/profiles
      ACTIVITY_UPLOAD_DIR: /data/private_uploads/activities
    volumes:
      - uploads_data:/data/uploads
      - private_uploads_data:/data/private_uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  uploads_data:
  private_uploads_data:

networks:
  app_network:
    driver: bridge
